[main]
# include=~/.config/foot/themes/noctalia
font=Noto Sans Mono:size=13
line-height=18

# 增加内边距（让文字离边缘有距离）
pad=20x20                    # 格式：水平x垂直，单位是像素

[colors-dark]
foreground=ffffff
background=1e1e2e
alpha=0.5
blur=true

# 常规颜色（亮色系）
regular0=2a2c3a              # 黑色 - 深灰（保持对比）
regular1=ff6b6b              # 红色 - 珊瑚红
regular2=c0e04f              # 绿色 - 草绿
regular3=ffd93d              # 黄色 - 向日葵黄
regular4=6c8eff              # 蓝色 - 天蓝
regular5=ff82e6              # 紫色 - 粉紫
regular6=4ad4c6              # 青色 - 薄荷青
regular7=e0e0e0              # 白色 - 浅灰白

# 亮色版（加粗/高亮时）
bright0=6c6f78              # 亮黑 - 暖灰
bright1=ff9999              # 亮红 - 浅红
bright2=cce87b              # 亮绿 - 嫩绿
bright3=ffe68f              # 亮黄 - 淡黄
bright4=9aaeff              # 亮蓝 - 淡蓝
bright5=ffb3e8              # 亮紫 - 浅粉紫
bright6=7ed6cf              # 亮青 - 淡青
bright7=ffffff              # 亮白 - 纯白

[cursor]
style=beam
