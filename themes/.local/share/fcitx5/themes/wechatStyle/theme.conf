[Metadata]
Name=wechatStyle
Version=1
Author=Custom
Description=WeChat Dark Style Theme
ScaleWithDPI=True

[InputPanel]
NormalColor=#b4b4b4
HighlightColor=#ffffff
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=5
Right=5
Top=5
Bottom=5

# ========== 候选框背景 ==========#
[InputPanel/Background]
# 引入深灰圆角背景图
Image=panel.svg
# 关键！左10, 右10, 上10, 下10 的区域(圆角部分)不会被拉伸
Margin=10,10,10,10

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

# ========== 高亮条背景 ==========#
[InputPanel/Highlight]
# 引入微信绿圆角背景图
Image=highlight.svg
# 左8, 右8, 上8, 下8 的区域(圆角部分)不会被拉伸
Margin=8,8,8,8

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

# ========== 右键菜单 ==========#
[Menu/Background]
Color=#2c2c2c
BorderColor=#3c3c3c
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#07C160

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#3c3c3c

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[AccentColorField]
0=Input Panel Border
1=Input Panel Highlight Candidate Background
2=Input Panel Highlight
3=Menu border
4=Menu Separator
5=Menu Selected Item Background
