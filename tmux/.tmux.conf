# 终端与输入
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -g mouse on
set -g history-limit 10000
set -s extended-keys on
set -s extended-keys-format csi-u
set -s escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g base-index 0
set -g pane-base-index 0
set -g mode-keys emacs
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
set -g monitor-activity on
set -g visual-activity off

# 状态栏保留 Macchiato 配色，显示窗口编号和当前按键模式
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=default'
set -g status-left-length 40
set -g status-left '#[fg=#181926,bg=#8aadf4,bold] #S #[fg=#8aadf4,bg=default,nobold]'
set -g status-right-length 100
set -g status-right '#[fg=#cad3f5,bg=#363a4f] %H:%M #[fg=#181926,bg=#8aadf4,bold] #{?#{==:#{@altkeys_mode},fish},fish,tmux} '
set -g window-status-format '#[fg=#a5adcb,bg=#363a4f] #I:#W '
set -g window-status-current-format '#[fg=#181926,bg=#a6da95,bold] #I:#W '
set -g window-status-activity-style 'fg=#ed8796,bg=#363a4f'
set -g window-status-bell-style 'fg=#181926,bg=#ed8796,bold'
set -g pane-border-style 'fg=#494d64'
set -g pane-active-border-style 'fg=#8aadf4'
set -g message-style 'fg=#181926,bg=#c6a0f6,bold'
set -g message-command-style 'fg=#cad3f5,bg=#363a4f'
set -g mode-style 'fg=#181926,bg=#f5bde6,bold'
set -g copy-mode-match-style 'fg=#181926,bg=#f5a97f'
set -g copy-mode-current-match-style 'fg=#181926,bg=#ed8796,bold'
set -g copy-mode-mark-style 'fg=#181926,bg=#eed49f'
set -g clock-mode-colour '#8aadf4'
set -g clock-mode-style 24
set -g menu-style 'fg=#cad3f5,bg=#363a4f'
set -g menu-selected-style 'fg=#181926,bg=#8aadf4'
set -g menu-border-style 'fg=#8aadf4'

# tmkeys 只覆盖当前窗格的模式；新窗格默认交给 tmux
set -g @altkeys_mode tmux
bind -n M-Left if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-Left } {
    if-shell -F '#{pane_at_left}' { previous-window } { select-pane -L }
}
bind -n M-Right if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-Right } {
    if-shell -F '#{pane_at_right}' { next-window } { select-pane -R }
}
bind -n M-Up if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-Up } { select-pane -U }
bind -n M-Down if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-Down } { select-pane -D }
bind -n M-S-Left if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-S-Left } { resize-pane -L 5 }
bind -n M-S-Right if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-S-Right } { resize-pane -R 5 }
bind -n M-S-Up if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-S-Up } { resize-pane -U 5 }
bind -n M-S-Down if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-S-Down } { resize-pane -D 5 }
bind -n M-0 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-0 } { select-window -t :=0 }
bind -n M-1 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-1 } { select-window -t :=1 }
bind -n M-2 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-2 } { select-window -t :=2 }
bind -n M-3 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-3 } { select-window -t :=3 }
bind -n M-4 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-4 } { select-window -t :=4 }
bind -n M-5 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-5 } { select-window -t :=5 }
bind -n M-6 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-6 } { select-window -t :=6 }
bind -n M-7 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-7 } { select-window -t :=7 }
bind -n M-8 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-8 } { select-window -t :=8 }
bind -n M-9 if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-9 } { select-window -t :=9 }
bind -n M-Enter if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-Enter } { new-window -c '#{pane_current_path}' }
bind -n M-h if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-h } { split-window -v -c '#{pane_current_path}' }
bind -n M-v if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-v } { split-window -h -c '#{pane_current_path}' }
bind -n M-q if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-q } {
    confirm-before -p '关闭当前窗格？(y/n)' { kill-pane }
}
bind -n M-w if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-w } { choose-window }
bind -n M-d if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-d } { detach-client }
bind -n M-t if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-t } {
    command-prompt -I '#W' { rename-window -- '%%' }
}
bind -n M-s if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-s } {
    command-prompt -I '#S' { rename-session -- '%%' }
}
bind -n M-r if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-r } { source-file ~/.tmux.conf }
bind -n M-j if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-j } { copy-mode; send-keys -X halfpage-down }
bind -n M-k if-shell -F '#{==:#{@altkeys_mode},fish}' { send-keys M-k } { copy-mode; send-keys -X halfpage-up }
