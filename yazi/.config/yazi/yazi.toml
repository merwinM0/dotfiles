# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 2, 2 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1000
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
Helix = [
    { run = "helix %s", orphan = true, block = true, for = "unix" },
]
Micro = [
    { run = 'micro "$s"', orphan = true, block = true, desc = "micro", for = "unix" },
]
Code = [
    { run = 'code "%s"', orphan = true, block = true, for = "unix" },
]
# 终端阅读器阻塞 Yazi，退出后回到文件列表；一次只打开当前/首个文件。
Tdf = [
    { run = 'tdf %s1', block = true, desc = "PDF：终端页面阅读（tdf）", for = "unix" },
]
Zathura = [
    { run = 'zathura %s1', orphan = true, desc = "PDF：图形阅读（Zathura）", for = "unix" },
]
PdfText = [
    { run = 'python3 "$HOME/.config/yazi/scripts/document-text.py" pdf %s1', block = true, desc = "PDF：纯文字（less）", for = "unix" },
]
Doxx = [
    { run = 'doxx %s1', block = true, desc = "DOCX：终端阅读（doxx）", for = "unix" },
]
DocxText = [
    { run = 'python3 "$HOME/.config/yazi/scripts/document-text.py" docx %s1', block = true, desc = "DOCX：纯文字（pandoc / less）", for = "unix" },
]
Doc = [
    { run = 'python3 "$HOME/.config/yazi/scripts/document-text.py" doc %s1', block = true, desc = "DOC：纯文字（antiword / less）", for = "unix" },
]
Csvlen = [
    { run = 'csvlens "%s"', orphan = true, block = true, desc = "csvlens", for = "unix" },
]

Typora = [
	{ run = 'sh -c "cd \"$(dirname %s)\" && env ELECTRON_OZONE_PLATFORM_HINT=x11 typora \"$(basename %s)\"" ', orphan = true, block = false, desc = "Typora", for = "unix" },
]

celluloid = [
    { run = 'celluloid %s', orphan = true, block = false, desc = "celluliod", for = "unix" },
]

# 一次显示当前/首张图片；无文字提示，按 Enter 直接返回 Yazi。
timg = [
    { run = 'sh "$HOME/.config/yazi/scripts/view-image.sh" %s1', block = true, desc = "timg", for = "unix" },
]

[open]
rules = [
    # Mp4
    { url = "*.mp4", use = [ "celluloid" ] },
    # 图片：先按 MIME 匹配，再用扩展名覆盖 MIME 尚未识别时的情况。
    { mime = "**/image/*", use = [ "timg" ] },
    { url = "*.{png,PNG,jpg,JPG,jpeg,JPEG,webp,WEBP,gif,GIF,bmp,BMP,tif,TIF,tiff,TIFF,svg,SVG,avif,AVIF,ico,ICO,qoi,QOI}", use = [ "timg" ] },
    # Word：只匹配文字文档，不把 XLSX / PPTX 误交给 doxx。
    { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = [ "Doxx", "DocxText" ] },
    { url = "*.docx", use = [ "Doxx", "DocxText" ] },
    { mime = "application/msword", use = [ "Doc" ] },
    { url = "*.doc", use = [ "Doc" ] },
    # CSV
    { url = "application/csv", use = [ "Csvlen" ] },
    { url = "text/csv", use = [ "Csvlen" ] },
    { url = "application/vnd.ms-excel", use = [ "Csvlen" ] },
    { url = "text/comma-separated-values", use = [ "Csvlen" ] },
    # PDF：Enter 用 tdf；O / Shift+Enter 可选择纯文字或图形阅读。
    { mime = "application/pdf", use = [ "Tdf", "PdfText", "Zathura" ] },
    { url = "*.pdf", use = [ "Tdf", "PdfText", "Zathura" ] },
    # Folder
    { url = "inode/directory", use = [ "Helix", "Code", "reveal" ] },
    # Empty file
    { url = "inode/empty", use = [ "Helix", "Code", "Micro", "reveal" ] },
    #markdown
    { url = "*.md", use = ["Typora"]},
    # Fallback
    { url = "*", use = [ "Helix", "Code", "Micro", "Doxx", "reveal","Typora" ] },
]

# PDF 保留 Yazi 内置的 pdftoppm 页面预览；Word 使用可滚动的文字预览。
[plugin]
prepend_previewers = [
    { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", run = 'piper -- python3 "$HOME/.config/yazi/scripts/document-text.py" --preview --width "$w" docx "$1"' },
    { url = "*.docx", run = 'piper -- python3 "$HOME/.config/yazi/scripts/document-text.py" --preview --width "$w" docx "$1"' },
    { mime = "application/msword", run = 'piper -- python3 "$HOME/.config/yazi/scripts/document-text.py" --preview --width "$w" doc "$1"' },
    { url = "*.doc", run = 'piper -- python3 "$HOME/.config/yazi/scripts/document-text.py" --preview --width "$w" doc "$1"' },
]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 536870912
image_bound      = [ 5000, 5000 ]
suppress_preload = false

[input]
cursor_blink = false

cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
trash_title   = "Trash {n} selected file{s}?"
trash_origin  = "center"
trash_offset  = [ 0, 0, 70, 20 ]

delete_title   = "Permanently delete {n} selected file{s}?"
delete_origin  = "center"
delete_offset  = [ 0, 0, 70, 20 ]

overwrite_title   = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin  = "center"
overwrite_offset  = [ 0, 0, 50, 15 ]

quit_title   = "Quit?"
quit_content = "The following tasks are still running, are you sure you want to quit?"
quit_origin  = "center"
quit_offset  = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false
