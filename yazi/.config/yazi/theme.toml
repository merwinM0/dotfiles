#:schema https://yazi-rs.github.io/schemas/theme.json
# 亮青主题（Yazi 26.9.1）：保留终端背景，整体提亮文字、强调色和图标。
# 亮青 #8be9e1 / 浅青 #bbf7ef / 柔青 #a8d8d4 / 青白 #f1fffc
# 深青 #14353b 仅用于亮色选中背景上的文字，以保持对比。

[app]
overall = { fg = "#f1fffc", bg = "reset" }

[mgr]
cwd = { fg = "#8be9e1", bold = true }
find_keyword  = { fg = "#ffe1a8", bold = true, underline = true }
find_position = { fg = "#bbf7ef", bg = "reset", italic = true }
symlink_target = { fg = "#a8d8d4", italic = true }

marker_copied   = { fg = "#b8efcf", bg = "#b8efcf" }
marker_cut      = { fg = "#ffb7c5", bg = "#ffb7c5" }
marker_marked   = { fg = "#8be9e1", bg = "#8be9e1" }
marker_selected = { fg = "#bbf7ef", bg = "#bbf7ef" }
count_copied   = { fg = "#14353b", bg = "#b8efcf" }
count_cut      = { fg = "#14353b", bg = "#ffb7c5" }
count_selected = { fg = "#14353b", bg = "#bbf7ef" }

border_symbol = "│"
border_style  = { fg = "#9fbfbd" }
syntect_theme = ""

[tabs]
active   = { fg = "#14353b", bg = "#8be9e1", bold = true }
inactive = { fg = "#a8d8d4", bg = "#29494f" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#14353b", bg = "#8be9e1", bold = true }
normal_alt  = { fg = "#8be9e1", bg = "#29494f" }
select_main = { fg = "#14353b", bg = "#bbf7ef", bold = true }
select_alt  = { fg = "#bbf7ef", bg = "#29494f" }
unset_main  = { fg = "#14353b", bg = "#ffb7c5", bold = true }
unset_alt   = { fg = "#ffb7c5", bg = "#29494f" }

[indicator]
parent  = { fg = "#14353b", bg = "#a8d8d4" }
current = { fg = "#14353b", bg = "#8be9e1", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = { fg = "#f1fffc" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#9fbfbd" }
perm_type  = { fg = "#b8efcf" }
perm_read  = { fg = "#f1fffc" }
perm_write = { fg = "#ffe1a8" }
perm_exec  = { fg = "#8be9e1" }
progress_label  = { fg = "#f1fffc", bold = true }
progress_normal = { fg = "#8be9e1", bg = "#29494f" }
progress_error  = { fg = "#ffb7c5", bg = "#29494f" }

[which]
border          = { fg = "#8be9e1" }
cols            = 3
mask            = { bg = "#14353b" }
cand            = { fg = "#8be9e1", bold = true }
rest            = { fg = "#9fbfbd" }
desc            = { fg = "#f1fffc" }
separator       = " → "
separator_style = { fg = "#9fbfbd" }

[confirm]
border     = { fg = "#8be9e1" }
title      = { fg = "#8be9e1", bold = true }
body       = { fg = "#f1fffc" }
list       = { fg = "#f1fffc" }
btn_yes    = { fg = "#14353b", bg = "#8be9e1", bold = true }
btn_no     = { fg = "#a8d8d4" }
btn_labels = [ "  [Y]es  ", "  [N]o  " ]

[spot]
border   = { fg = "#8be9e1" }
title    = { fg = "#8be9e1", bold = true }
tbl_col  = { fg = "#a8d8d4" }
tbl_cell = { fg = "#14353b", bg = "#8be9e1" }

[notify]
title_info  = { fg = "#8be9e1" }
title_warn  = { fg = "#ffe1a8" }
title_error = { fg = "#ffb7c5" }
icon_info  = "i"
icon_warn  = "!"
icon_error = "x"

[pick]
border   = { fg = "#8be9e1" }
active   = { fg = "#14353b", bg = "#8be9e1", bold = true }
inactive = { fg = "#f1fffc" }

[input]
border   = { fg = "#8be9e1" }
title    = { fg = "#8be9e1" }
value    = { fg = "#f1fffc" }
selected = { fg = "#14353b", bg = "#8be9e1" }

[cmp]
border   = { fg = "#8be9e1" }
active   = { fg = "#14353b", bg = "#8be9e1" }
inactive = { fg = "#f1fffc" }
icon_file    = "󰈔"
icon_folder  = "󰉋"
icon_command = "󰘳"

[tasks]
border  = { fg = "#8be9e1" }
title   = { fg = "#8be9e1" }
hovered = { fg = "#bbf7ef", underline = true }

[help]
border  = { fg = "#8be9e1" }
chord   = { fg = "#8be9e1", bold = true }
action  = { fg = "#f1fffc" }
hovered = { fg = "#14353b", bg = "#8be9e1", bold = true }

[filetype]
rules = [
    { mime = "**/image/*", fg = "#bbf7ef" },
    { mime = "**/{audio,video}/*", fg = "#8be9e1" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#ffe1a8" },
    { mime = "**/application/{pdf,doc*,xls*,ppt*,rtf}", fg = "#a8d8d4" },
    { url = "*", is = "orphan", fg = "#14353b", bg = "#ffb7c5" },
    { url = "*", is = "exec", fg = "#b8efcf" },
    { url = "*/", fg = "#8be9e1" },
    { url = "*", fg = "#f1fffc" },
]

[icon]
globs = []
dirs = [
    { name = ".config", text = "", fg = "#8be9e1" },
    { name = ".git", text = "", fg = "#a8d8d4" },
    { name = ".github", text = "", fg = "#a8d8d4" },
    { name = "Desktop", text = "", fg = "#8be9e1" },
    { name = "Documents", text = "", fg = "#8be9e1" },
    { name = "Downloads", text = "", fg = "#8be9e1" },
    { name = "Music", text = "", fg = "#8be9e1" },
    { name = "Pictures", text = "", fg = "#8be9e1" },
    { name = "Videos", text = "", fg = "#8be9e1" },
]
files = [
    { name = ".bashrc", text = "", fg = "#c6f2a6" },
    { name = ".gitconfig", text = "", fg = "#ffb3a1" },
    { name = ".vimrc", text = "", fg = "#89e0b0" },
    { name = ".zshrc", text = "", fg = "#c6f2a6" },
    { name = "Makefile", text = "", fg = "#abc9cb" },
    { name = "README.md", text = "", fg = "#f1fffc" },
]
exts = [
    { name = "rs", text = "", fg = "#ffc397" },
    { name = "go", text = "", fg = "#8bddf2" },
    { name = "js", text = "", fg = "#f5ed92" },
    { name = "py", text = "", fg = "#ffe08a" },
    { name = "json", text = "", fg = "#f5ed92" },
    { name = "toml", text = "", fg = "#ffb394" },
    { name = "md", text = "", fg = "#f1fffc" },
]
conds = [
    { if = "orphan", text = "", fg = "#ffb7c5" },
    { if = "link", text = "", fg = "#a8d8d4" },
    { if = "dir", text = "", fg = "#8be9e1" },
    { if = "exec", text = "", fg = "#b8efcf" },
    { if = "!dir", text = "󰈔", fg = "#f1fffc" },
]
