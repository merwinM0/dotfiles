# 你自定义的 Yazi 主题配置文件
# 配色风格：文件主色为白色，选中项背景为天蓝色

# 如果你后续想使用现成的主题包（flavor），可以在这里配置
# [flavor]
# dark  = "catppuccin-mocha"   # 示例：深色主题包
# light = "catppuccin-latte"   # 示例：浅色主题包

# : 整体外观 {{{
[app]
overall = { bg = "reset" }

# : 文件管理器核心区 {{{
[mgr]
# 当前工作目录
cwd = { fg = "#89b4fa" }

# 光标悬停的文件 (实现“选中背景是天蓝色”的关键)
hovered         = { bg = "#89b4fa", fg = "black" }  # 使用天蓝色背景，黑色字体以保证可读性
preview_hovered = { underline = true }

# 查找时高亮的关键词
find_keyword  = { fg = "#f9e2af", bold = true, underline = true }
find_position = { fg = "#f38ba8", bg = "reset", italic = true }

# 符号链接的指向
symlink_target = { italic = true }

# 标记 (复制、剪切、选中) 的样式
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#89b4fa", bg = "#89b4fa" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

# 标记数量显示
count_copied   = { fg = "black", bg = "#a6e3a1" }
count_cut      = { fg = "black", bg = "#f38ba8" }
count_selected = { fg = "black", bg = "#f9e2af" }

# 边框样式
border_symbol = "│"
border_style  = { fg = "#585b70" }

# 语法高亮主题，为空则使用 flavor 自带的
syntect_theme = ""

# : 选项卡 {{{
[tabs]
active   = { bg = "#89b4fa", bold = true }  # 激活的选项卡也使用天蓝色
inactive = { fg = "#89b4fa", bg = "#313244" }

# 分隔符
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : 模式指示器 {{{
# 正常模式
normal_main = { bg = "#89b4fa", bold = true }
normal_alt  = { fg = "#89b4fa", bg = "#313244" }

# 可视模式（选中模式，实现“选中背景是天蓝色”的另一个关键点）
select_main = { bg = "#89b4fa", bold = true }  # 可视模式下主区域背景为天蓝色
select_alt  = { fg = "#89b4fa", bg = "#313244" }

# 反选模式
unset_main = { bg = "#f38ba8", bold = true }
unset_alt  = { fg = "#f38ba8", bg = "#313244" }

# : 状态栏 {{{
[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# 权限显示
perm_sep   = { fg = "#585b70" }
perm_type  = { fg = "#a6e3a1" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#89b4fa" }

# 进度条
progress_label  = { bold = true }
progress_normal = { fg = "#89b4fa", bg = "#1e1e2e" }
progress_error  = { fg = "#f38ba8", bg = "#1e1e2e" }

# : 命令面板 (Which key) {{{
[which]
cols            = 3
mask            = { bg = "#181825" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#6c7086" }
desc            = { fg = "#cba6f7" }
separator       = " → "
separator_style = { fg = "#585b70" }

# : 确认对话框 {{{
[confirm]
border     = { fg = "#89b4fa" }
title      = { fg = "#89b4fa" }
content    = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  [N]o  " ]

# : 聚焦功能 (Spotter) {{{
[spot]
border = { fg = "#89b4fa" }
title  = { fg = "#89b4fa" }

# 表格
tbl_col  = { fg = "#89b4fa" }
tbl_cell = { fg = "#f9e2af", reversed = true }

# : 通知消息 {{{
[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

# 图标
icon_info  = "i"
icon_warn  = "!"
icon_error = "x"

# : 文件拾取器 {{{
[pick]
border   = { fg = "#89b4fa" }
active   = { fg = "#cba6f7", bold = true }
inactive = {}

# : 输入框 {{{
[input]
border   = { fg = "#89b4fa" }
title    = {}
value    = {}
selected = { reversed = true }

# : 自动补全 {{{
[cmp]
border   = { fg = "#89b4fa" }
active   = { reversed = true }
inactive = {}

# 图标
icon_file    = "󰈔"
icon_folder  = "󰉋"
icon_command = "󰘳"

# : 任务管理器 {{{
[tasks]
border  = { fg = "#89b4fa" }
title   = {}
hovered = { fg = "#cba6f7", underline = true }

# : 帮助菜单 {{{
[help]
on      = { fg = "#89b4fa" }
run     = { fg = "#cba6f7" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#cdd6f4", bg = "#313244" }

# : 文件类型特定样式（核心：让所有文件默认显示为白色）{{{
[filetype]
rules = [
    # 图片文件
    { mime = "image/*", fg = "#f38ba8" },
    # 音视频文件
    { mime = "{audio,video}/*", fg = "#89b4fa" },
    # 压缩包
    { mime = "application/{zip,rar,7z*,tar,gzip,xz}", fg = "#fab387" },
    # 文档
    { mime = "application/{pdf,doc*,xls*,ppt*}", fg = "#a6e3a1" },

    # 特殊文件：失效的符号链接
    { url = "*", is = "orphan", bg = "#f38ba8" },
    # 特殊文件：可执行文件
    { url = "*", is = "exec", fg = "#a6e3a1" },

    # 目录
    { url = "*/", fg = "#89b4fa" },

    # ---------- 最关键的部分：所有其他文件，字体主色为白色 ----------
    # 这是你“字体白色”需求的核心规则
    { mime = "*", fg = "#cdd6f4" }, # fg 是前景色，即字体颜色，使用接近白色的柔白
]

# : 图标配置（使用 Nerd Fonts）{{{
