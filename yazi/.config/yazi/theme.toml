conds = [
    # 为不同类型的文件或目录提供默认图标
    { if = "orphan", text = "" },
    { if = "link", text = "" },
    { if = "dir", text = "" },
    { if = "exec", text = "" },
    { if = "!dir", text = "󰈔" },
]
